<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Server error — AI Workforce</title>
    <style>
        :root { color-scheme: light; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', sans-serif;
               background:#f5f5f7; color:#1c1c1e; display:flex; align-items:center;
               justify-content:center; min-height:100vh; -webkit-font-smoothing:antialiased; }
        .err { text-align:center; padding: 2rem; max-width: 460px; }
        .err__code { font-size: 5rem; font-weight: 700; color:#dc2626; line-height: 1; letter-spacing:-0.03em; }
        .err h1 { font-size: 1.5rem; margin: 1rem 0 .5rem; font-weight:600; }
        .err p { color:#636366; font-size:.875rem; margin-bottom:1.5rem; line-height:1.5; }
        .err a { display:inline-block; padding:.5rem 1rem; background:#007aff; color:#fff;
                 border-radius:10px; text-decoration:none; font-size:.875rem; font-weight:500; }
        .err a:hover { background:#0066d6; }
    </style>
</head>
<body>
    <div class="err">
        <div class="err__code">500</div>
        <h1>Something went wrong</h1>
        <p>An unexpected error occurred on our side. The team has been notified. Please try again in a moment.</p>
        <a href="/">Back to home</a>
    </div>
</body>
</html>
